<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappit Heartz Login</title>
  <style>
    :root {
      --silver: #c0c0c0;
      --white: #ffffff;
      --ink: #202124;
      --muted: #667085;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #f8f9fa;
      overflow: hidden;
      position: relative;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.4), transparent 60%);
      pointer-events: none;
      z-index: 5;
    }

    .screen {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .left-panel {
      width: 42%;
      min-width: 380px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .right-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #f3f4f6 40%,
        #ffffff 100%
      );
    }

    .right-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 112%, rgba(255, 255, 255, 0.86) 0 7%, rgba(255, 255, 255, 0.34) 20%, transparent 48%),
        linear-gradient(to top, rgba(196, 205, 216, 0.36), rgba(232, 235, 240, 0.18) 52%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    .login-content {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .light-core {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9), transparent 70%);
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(20px);
      z-index: 3;
    }

    .light-rays {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.7), transparent 60%),
        conic-gradient(from 180deg at 50% 100%, transparent 0deg, rgba(192, 198, 208, 0.18) 20deg, transparent 42deg, rgba(255, 255, 255, 0.42) 60deg, transparent 86deg, rgba(205, 212, 222, 0.16) 118deg, transparent 150deg, rgba(255, 255, 255, 0.34) 182deg, transparent 220deg, rgba(200, 208, 220, 0.16) 250deg, transparent 300deg, rgba(255, 255, 255, 0.3) 330deg, transparent 360deg);
      opacity: 0.6;
      z-index: 2;
    }

    .light-pulse {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent 70%);
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 5s ease-in-out infinite;
      z-index: 4;
    }

    .light-pulse::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(184, 194, 207, 0.32);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.42);
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.5;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.9;
      }

      100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.5;
      }
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background:
        linear-gradient(145deg, #ffffff, #d8d8d8),
        linear-gradient(135deg, var(--silver), var(--white));
      border: 1px solid rgba(192, 192, 192, 0.72);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 10px 26px rgba(15, 23, 42, 0.1);
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 700;
      color: #3f434a;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .auth-actions {
      display: grid;
      gap: 12px;
    }

    .auth-button {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .auth-button:hover {
      transform: translateY(-1px);
      border-color: var(--silver);
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.1);
    }

    .auth-button:focus-visible {
      outline: 3px solid rgba(192, 192, 192, 0.42);
      outline-offset: 3px;
    }

    .provider-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #eeeeee);
      border: 1px solid #d7dbe2;
      color: #333842;
    }

    #authStatus {
      min-height: 20px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    #authStatus.error {
      color: #b42318;
    }

    @media (max-width: 760px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .screen {
        flex-direction: column;
        min-height: 100vh;
      }

      .left-panel {
        width: 100%;
        min-width: 0;
        min-height: 58vh;
        padding: 32px 24px;
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .right-panel {
        min-height: 42vh;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="left-panel">
      <div class="login-content" aria-label="Mappit Heartz login">
        <div class="brand-mark" aria-hidden="true">M</div>
        <h1>Mappit Heartz</h1>
        <p class="subtitle">Sign in to continue to your saved map workspace.</p>

        <div class="auth-actions">
          <button class="auth-button" id="googleLoginBtn" type="button">
            <span class="provider-icon" aria-hidden="true">G</span>
            Continue with Google
          </button>

          <button class="auth-button" id="githubLoginBtn" type="button">
            <span class="provider-icon" aria-hidden="true">GH</span>
            Continue with GitHub
          </button>
        </div>

        <p id="authStatus" role="status"></p>
      </div>
    </div>

    <div class="right-panel" aria-hidden="true">
      <div class="light-core"></div>
      <div class="light-rays"></div>
      <div class="light-pulse"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
